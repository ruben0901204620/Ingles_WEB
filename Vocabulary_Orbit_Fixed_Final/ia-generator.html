<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Generator - Vocabulary Orbit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="ia-mode">
    <button id="theme-toggle" onclick="toggleTheme()">🌓</button>
    <canvas id="antigravity-canvas"></canvas>

    <div id="app">
        <span class="back-link" onclick="volverAlMenu()">← Volver al Menú</span>
        
        <div class="card ia-card">
            <div class="token-meter" title="Doble clic para resetear">
                <div class="token-header">
                    <span>Tokens IA (OpenRouter)</span>
                    <span id="tokenPercentage">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="tense-selector">
                <button class="tense-btn active" data-tense="past">Pasado</button>
                <button class="tense-btn" data-tense="present">Presente</button>
                <button class="tense-btn" data-tense="continuous">Continuo</button>
            </div>

            <div class="spanish-display">
                <p id="spanishSentence">Elige un tiempo y pulsa Generar</p>
            </div>

            <textarea id="userInputIA" placeholder="Traduce aquí..."></textarea>
            <div id="feedbackIA" class="ia-feedback"></div>

            <div class="button-group">
                <button id="checkBtnIA" class="category-btn">Verificar</button>
                <button id="resetBtnIA" class="category-btn secondary">Nueva Oración</button>
            </div>
        </div>
    </div>

    <script src="js/dictionary.js"></script>
    <script src="js/ia-logic.js"></script>
    <script src="js/main.js"></script>
    <script>
        function volverAlMenu() {
            localStorage.removeItem('temaParticulas');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
